workspace:
  inheritedTasks:
    include:
      - scad.docs
      - scad.build
      - scad.verify

tasks:
  scad.docs:
    inputs:
      - 'openscad/**/*.scad'
      - 'openscad/**/design/**'

  scad.build:
    inputs:
      - 'openscad/**/*.scad'
      - 'openscad/**/render.yml'

  scad.verify:
    inputs:
      - 'doc/50-00-verification.md'
      - 'openscad/**/*.scad'
      - 'test/**'
      - 'vrf/**'
      - 'scripts/**'
      - 'bootstrap.sh'
      - 'bootstrap.ps1'
      - 'update.sh'
      - 'update.ps1'
      - '.github/workflows/**'
      - 'tools/tool.git-project'
