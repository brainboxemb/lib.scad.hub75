workspace:
  inheritedTasks:
    include:
      - scad.docs
      - scad.build
      - scad.verify

tasks:
  scad.docs:
    inputs:
      - 'openscad/**/*.scad'
      - 'openscad/**/design/**'

  scad.build:
    inputs:
      - 'openscad/**/*.scad'
      - 'openscad/**/render.yml'

  scad.verify:
    inputs:
      - 'openscad/p5-64x32-panel/hub75_p5_64x32_panel.scad'
      - 'test/**'
      - 'vrf/README.md'
      - 'vrf/fixtures/**'
      - 'vrf/top-left/**'
      - 'vrf/measurement-catalog.yml'
      - 'vrf/physical-panel-validation.md'
      - 'vrf/test-case-template.md'
      - 'scripts/run-verification.sh'
      - 'scripts/build-verification-index.sh'
      - 'bootstrap.sh'
      - 'bootstrap.ps1'
      - 'update-repo.sh'
      - 'update-repo.ps1'
      - '.github/workflows/**'
      - 'tools/tool.git-project'
