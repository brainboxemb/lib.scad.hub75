name: Agent align preview cameras

on:
  push:
    branches:
      - "docs/root-preview"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Align overview cameras
        shell: python
        run: |
          from pathlib import Path

          path = Path("openscad/p5-64x32-panel/design/design.md")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  "<!-- scad-render\nview: front\nvpr: [68, 0, 32]\n-->",
                  "<!-- scad-render\nview: front\nvpr: [85, 0, 40]\n-->",
              ),
              (
                  "<!-- scad-render\nview: rear\nvpr: [68, 0, 212]\n-->",
                  "<!-- scad-render\nview: rear\nvpr: [85, 0, 220]\n-->",
              ),
          ]

          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one overview block: {old!r}")
              text = text.replace(old, new)

          path.write_text(text, encoding="utf-8")

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/agent-align-preview-cameras.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add openscad/p5-64x32-panel/design/design.md .github/workflows/agent-align-preview-cameras.yml
          git commit -m "docs: align panel preview cameras with frame projects"
          git push origin HEAD
