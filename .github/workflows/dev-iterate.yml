name: Development HUB75 build

on:
  push:
    branches:
      - chatgpt/design-doc-iteration
  workflow_dispatch:

concurrency:
  group: hub75-dev-iteration
  cancel-in-progress: true

permissions:
  contents: write
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/brainboxemb/scad-toolchain:v0.3.0

    steps:
      - name: Checkout project and pinned submodules
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Configure Git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Show toolchain
        run: scad-toolchain-info

      - name: Check project
        run: |
          bash ./tools/tool.scad-project/scad-project.sh tooling-check
          bash ./tools/tool.scad-project/scad-project.sh config-lint
          bash ./tools/tool.scad-project/scad-project.sh externals-check
          bash ./tools/tool.scad-project/scad-project.sh docs-lint
          bash ./tools/tool.scad-project/scad-project.sh design-lint

      - name: Generate build
        run: |
          bash ./tools/tool.scad-project/scad-project.sh design-build
          bash ./tools/tool.scad-project/scad-project.sh build
          bash ./tools/tool.scad-project/scad-project.sh build-index

      - name: Record build provenance
        run: |
          cat > bld/publication-info.txt <<EOF
          Publication branch : dev/build
          Source repository   : $GITHUB_REPOSITORY
          Source branch       : $GITHUB_REF_NAME
          Source commit       : $GITHUB_SHA
          Triggered by        : $GITHUB_ACTOR
          Workflow run        : $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          EOF

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: lib-scad-hub75-dev-build
          path: bld

      - name: Publish development build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config --global credential.helper store
          printf "https://x-access-token:%s@github.com\n" "$GITHUB_TOKEN" > ~/.git-credentials
          bash ./tools/tool.scad-project/scad-project.sh publish-build

  verify:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/brainboxemb/scad-toolchain:v0.3.0

    steps:
      - name: Checkout project and pinned submodules
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Configure Git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Verify project
        run: |
          bash ./tools/tool.scad-project/scad-project.sh verify
          bash ./tools/tool.scad-project/scad-project.sh functional-verify

      - name: Record verification provenance
        run: |
          cat > vrf/out/publication-info.txt <<EOF
          Publication branch : dev/verification
          Source repository   : $GITHUB_REPOSITORY
          Source branch       : $GITHUB_REF_NAME
          Source commit       : $GITHUB_SHA
          Triggered by        : $GITHUB_ACTOR
          Workflow run        : $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          EOF

      - name: Upload verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: lib-scad-hub75-dev-verification
          path: vrf/out

      - name: Publish development verification
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config --global credential.helper store
          printf "https://x-access-token:%s@github.com\n" "$GITHUB_TOKEN" > ~/.git-credentials
          bash ./tools/tool.scad-project/scad-project.sh publish-verification
