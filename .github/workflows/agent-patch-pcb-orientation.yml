name: Agent patch PCB orientation markers

on:
  push:
    branches:
      - "agent/pcb-orientation-silkscreen"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move orientation arrows onto PCB surface
        shell: python
        run: |
          from pathlib import Path

          scad_path = Path("openscad/p5-64x32-panel/hub75_p5_64x32_panel.scad")
          text = scad_path.read_text(encoding="utf-8")

          start_marker = "    module _pcb_arrow("
          end_marker = "\n\n\n    module _orientation_arrows()"
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          block = text[start:end]

          replacements = [
              (
                  "arrow_color = [0.85, 0.85, 0.85, 1]) {",
                  "arrow_color = [1, 1, 1, 1]) {\n        coating_thickness = 0.10;",
              ),
              (
                  "        // Simple rear-PCB orientation marker. These arrows are included because\n"
                  "        // they make the portrait rotation of the real panel unambiguous.\n"
                  "        // They are visual reference features, not dimensional geometry.",
                  "        // Rear-PCB orientation marking modelled as a thin white coating.\n"
                  "        // The extrusion starts at the coating's rear face and runs back to\n"
                  "        // pcb_back_y, so the marking sits directly on the PCB instead of floating.",
              ),
              ("mounting_plane_y_value + 0.01", "pcb_back_y + coating_thickness"),
              ("linear_extrude(height=0.35)", "linear_extrude(height=coating_thickness)"),
          ]

          for old, new in replacements:
              if block.count(old) != 1:
                  raise SystemExit(f"expected exactly one occurrence in _pcb_arrow: {old!r}")
              block = block.replace(old, new)

          text = text[:start] + block + text[end:]
          scad_path.write_text(text, encoding="utf-8")

          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text(encoding="utf-8")
          anchor = "## Unreleased\n"
          entry = (
              "\n### Changed\n\n"
              "- Place the rear PCB orientation arrows directly on the PCB as a 0.10 mm white coating instead of 0.35 mm markers at the rear mounting plane.\n"
          )
          if anchor not in changelog:
              raise SystemExit("Unreleased changelog section not found")
          if "0.10 mm white coating" not in changelog:
              changelog = changelog.replace(anchor, anchor + entry, 1)
              changelog_path.write_text(changelog, encoding="utf-8")

          updated = scad_path.read_text(encoding="utf-8")
          checks = [
              "arrow_color = [1, 1, 1, 1]",
              "coating_thickness = 0.10;",
              "pcb_back_y + coating_thickness",
              "linear_extrude(height=coating_thickness)",
          ]
          for check in checks:
              if check not in updated:
                  raise SystemExit(f"missing expected patched content: {check}")

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/agent-patch-pcb-orientation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add openscad/p5-64x32-panel/hub75_p5_64x32_panel.scad CHANGELOG.md .github/workflows/agent-patch-pcb-orientation.yml
          git commit -m "fix: place HUB75 orientation arrows on PCB"
          git push origin HEAD
