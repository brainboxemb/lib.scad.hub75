name: Temporary design image optimization

on:
  push:
    branches:
      - fix/rear-bay-cut-and-render-config

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Optimize design image sizing and rear core camera
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          project = Path('project.yml')
          text = project.read_text(encoding='utf-8')
          old = '  design_image_size: [1600, 1200]'
          new = '  design_image_size: [640, 480]'
          if old not in text:
              raise SystemExit('expected design_image_size not found')
          project.write_text(text.replace(old, new, 1), encoding='utf-8')

          design = Path('openscad/p5-64x32-panel/hub75_p5_64x32_panel/design/design.md')
          text = design.read_text(encoding='utf-8')

          # The default 640x480 canvas is sufficient for all normal construction
          # views. Keep only deliberately smaller, tightly framed detail images.
          for line in (
              'size: [760, 560]\n',
              'size: [800, 580]\n',
              'size: [900, 650]\n',
          ):
              text = text.replace(line, '')

          for view in ('bay-rounded-corner', 'narrow-transition-left', 'narrow-transition-right'):
              marker = f'view: {view}\n'
              if marker not in text:
                  raise SystemExit(f'missing design view {view}')
              text = text.replace(marker, marker + 'size: [480, 360]\n', 1)

          old_camera = 'view: rear-frame-core\nvpr: [90, 0, 0]\n'
          new_camera = 'view: rear-frame-core\nvpr: [90, 0, 180]\n'
          if old_camera not in text:
              raise SystemExit('rear-frame-core camera marker not found')
          text = text.replace(old_camera, new_camera, 1)

          design.write_text(text, encoding='utf-8')
          PY
      - name: Commit optimized design settings
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add project.yml openscad/p5-64x32-panel/hub75_p5_64x32_panel/design/design.md
          git commit -m 'docs: optimize HUB75 design image sizes'
          git push
