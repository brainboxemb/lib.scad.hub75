name: Temporary core rollback

on:
  push:
    branches:
      - fix/rear-bay-cut-and-render-config

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rear-bay-cut-and-render-config
          fetch-depth: 0
      - name: Restore original 3D core construction
        run: python .tmp-revert-core.py
      - name: Remove temporary patch machinery
        run: git rm .tmp-revert-core.py .github/workflows/tmp-revert-core.yml
      - name: Commit rollback
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add openscad/p5-64x32-panel/hub75_p5_64x32_panel.scad
          git commit -m 'fix: keep vertical bay subtraction with robust relief'
          git push origin HEAD:fix/rear-bay-cut-and-render-config
