name: Agent patch angled README preview

on:
  push:
    branches:
      - "docs/root-preview"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make front and rear overview renders angled
        shell: python
        run: |
          from pathlib import Path

          design_path = Path("openscad/p5-64x32-panel/design/design.md")
          design = design_path.read_text(encoding="utf-8")

          replacements = [
              (
                  "<!-- scad-render\nview: front\nvpr: [90, 0, 0]\n-->",
                  "<!-- scad-render\nview: front\nvpr: [68, 0, 32]\n-->",
              ),
              (
                  "<!-- scad-render\nview: rear\nvpr: [90, 0, 180]\n-->",
                  "<!-- scad-render\nview: rear\nvpr: [68, 0, 212]\n-->",
              ),
          ]

          for old, new in replacements:
              if design.count(old) != 1:
                  raise SystemExit(f"expected exactly one overview render block: {old!r}")
              design = design.replace(old, new)

          design_path.write_text(design, encoding="utf-8")

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          readme = readme.replace('<th align="center">Front</th>', '<th align="center">Front angled</th>', 1)
          readme = readme.replace('<th align="center">Rear</th>', '<th align="center">Rear angled</th>', 1)
          readme_path.write_text(readme, encoding="utf-8")

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/agent-patch-angled-preview.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md openscad/p5-64x32-panel/design/design.md .github/workflows/agent-patch-angled-preview.yml
          git commit -m "docs: use angled panel previews"
          git push origin HEAD
