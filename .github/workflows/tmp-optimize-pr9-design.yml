name: Temporary PR9 design optimisation

on:
  push:
    branches:
      - fix/rear-bay-cut-and-render-config

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply design sizing and SCons config
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          project = Path('project.yml')
          text = project.read_text(encoding='utf-8')
          if 'build_engine:' not in text:
              marker = '\nopenscad:\n'
              text = text.replace(marker, '\nbuild_engine:\n  engine: scons\n' + marker, 1)
              project.write_text(text, encoding='utf-8')

          design = Path('openscad/p5-64x32-panel/hub75_p5_64x32_panel/design/design.md')
          text = design.read_text(encoding='utf-8')
          detail_views = [
              'bay-rounded-corner',
              'narrow-end-width',
              'narrow-transition-left',
              'narrow-transition-right',
              'bay-bottom-relief',
              'bay-1',
              'reinforcement-solids',
              'recess-bottom',
              'rear-after-recess',
              'mounting-relief-single',
              'mounting-tube-single',
              'reinforcement-inner-recess',
              'reinforcement-blind-hole',
              'locator-upper-left',
              'data-connector-bottom',
              'power-connector',
          ]
          for view in detail_views:
              pattern = re.compile(
                  r'(<!-- scad-render\nview: ' + re.escape(view) + r'\n)(?!size:)',
                  re.MULTILINE,
              )
              text = pattern.sub(r'\1size: [480, 360]\n', text, count=1)
          design.write_text(text, encoding='utf-8')
          PY
      - name: Commit source changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- project.yml openscad/p5-64x32-panel/hub75_p5_64x32_panel/design/design.md; then
            echo "No source changes needed."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add project.yml openscad/p5-64x32-panel/hub75_p5_64x32_panel/design/design.md
          git commit -m 'build: optimise panel design renders'
          git push
