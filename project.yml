project:
  name: lib.scad.hub75

tooling:
  tool_scad_project:
    type: git-submodule
    url: https://github.com/brainboxemb/tool.scad-project.git
    path: tools/tool.scad-project
    ref: v0.9.8

paths:
  design_root: .
  build_root: bld

openscad:
  common_flags:
    - --enable=object-function
  render_flags:
    - --render
  image_size: [1600, 1000]
  design_image_size: [1600, 1200]

externals: []

builds:
  - name: hub75-p5-64x32-panel-front-angled
    source: openscad/p5-64x32-panel/hub75_p5_64x32_panel/render/front-angled.scad
    output: bld/png/hub75-p5-64x32-panel-front-angled.png
    size: [1000, 1600]

  - name: hub75-p5-64x32-panel-rear-angled
    source: openscad/p5-64x32-panel/hub75_p5_64x32_panel/render/rear-angled.scad
    output: bld/png/hub75-p5-64x32-panel-rear-angled.png
    size: [1000, 1600]

verification:
  commands:
    - [bash, scripts/run-verification.sh]
    - [bash, scripts/build-verification-index.sh]
  output_root: vrf/out

publication:
  production:
    source_branch: main
    build_branch: prod/build
    verification_branch: prod/verification

  development:
    build_branch: dev/build
    verification_branch: dev/verification

  tags:
    pattern: "v*"

  release:
    branch_prefix: rel
    tag_pattern: "v*"
